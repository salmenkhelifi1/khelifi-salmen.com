[build]
  base = "nextjs-portfolio"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/llms.txt"

  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms-full.txt"

  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/services.md"

  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/pricing.md"

  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/ingest/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  host = "us-assets.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/array/*"
  to = "https://us-assets.i.posthog.com/array/:splat"
  host = "us-assets.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://us.i.posthog.com/:splat"
  host = "us.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "https://khelifi-salmen.com/*"
  to = "https://www.khelifi-salmen.com/:splat"
  status = 301
  force = true
